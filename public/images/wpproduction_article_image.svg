<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <rect width="1200" height="630" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Center panel -->
  <rect x="160" y="140" width="880" height="350" rx="24" fill="rgba(30,41,59,0.6)"/>

  <!-- Sampling title -->
  <text x="600" y="210" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">KREATIVNO SAMPLIRANJE</text>
  <text x="600" y="242" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">MUZIČKA PRODUKCIJA &bull; AUDIO WAVEFORM</text>

  <!-- Equalizer bars -->
  <g transform="translate(300, 280)">
    <rect x="0" y="0" width="22" height="120" fill="url(#waveGrad)" filter="url(#glow)" rx="3"/>
    <rect x="32" y="40" width="22" height="80" fill="url(#waveGrad)" rx="3"/>
    <rect x="64" y="100" width="22" height="20" fill="url(#waveGrad)" rx="3"/>
    <rect x="96" y="20" width="22" height="140" fill="url(#waveGrad)" filter="url(#glow)" rx="3"/>
    <rect x="128" y="160" width="22" height="0" fill="url(#waveGrad)" rx="3"/>
    <rect x="160" y="60" width="22" height="100" fill="url(#waveGrad)" rx="3"/>
    <rect x="192" y="0" width="22" height="160" fill="url(#waveGrad)" filter="url(#glow)" rx="3"/>
    <rect x="224" y="140" width="22" height="20" fill="url(#waveGrad)" rx="3"/>
    <rect x="256" y="80" width="22" height="80" fill="url(#waveGrad)" rx="3"/>
    <rect x="288" y="20" width="22" height="140" fill="url(#waveGrad)" filter="url(#glow)" rx="3"/>
  </g>

  <!-- Waveform line -->
  <polyline points="450,300 480,240 510,300 540,200 570,300 600,260 630,300 660,180 690,300 720,220 750,300" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Vinyl / record motif -->
  <circle cx="900" cy="320" r="70" fill="rgba(255,255,255,0.08)"/>
  <circle cx="900" cy="320" r="50" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <circle cx="900" cy="320" r="10" fill="#3b82f6"/>
  <path d="M900 250 L900 180" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <path d="M900 390 L900 460" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Bottom tag -->
  <rect x="460" y="510" width="280" height="44" rx="12" fill="rgba(15,23,42,0.8)"/>
  <text x="600" y="540" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#60a5fa" text-anchor="middle">B&amp;H ASSISTANT â€¢ BA</text>
</svg>
